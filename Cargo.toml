[package]
name = "project-lore"
version = "0.1.0"
edition = "2024"
description = "A shared second brain for coding agents, served over MCP"

[[bin]]
name = "lore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
fastembed = "7"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
