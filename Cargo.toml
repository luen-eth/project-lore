[package]
name = "project-lore"
version = "0.1.0"
edition = "2024"
description = "A shared second brain for coding agents, served over MCP"

[[bin]]
name = "lore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
fastembed = "7"
flate2 = "1"
getrandom = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
schemars = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "io-util", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
mail-parser = "1.0.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
# Already built as part of tokio-tungstenite; named here for its Sink/Stream helpers.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Already built (through tempfile); named here for the runner's terminals: a PTY,
# its window size, a new session for the shell, and killing that session.
rustix = { version = "1", features = ["pty", "termios", "process"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
# The root-only test that prepares a terminal's home without
# CAP_DAC_OVERRIDE drops that capability in its own thread.
rustix = { version = "1", features = ["pty", "termios", "process", "thread"] }
