<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">project-lore architecture</title>
  <desc id="d">Coding agents connect over MCP with a bearer token to a single Rust binary that authenticates them, serves seven tools, searches with keywords and embeddings, and stores everything in one SQLite file. A password-protected admin view reads the same data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8791a8"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="20" fill="url(#bg)"/>

  <!-- Agents -->
  <text x="48" y="58" fill="#8791a8" font-size="12" font-weight="600" letter-spacing="1.4">AGENTS</text>
  <g font-size="16" fill="#e7ecf7">
    <g>
      <rect x="40" y="80" width="230" height="64" rx="14" fill="#0e1524" stroke="#5eb1ff" stroke-opacity=".55"/>
      <circle cx="68" cy="112" r="9" fill="#5eb1ff" filter="url(#glow)"/><circle cx="68" cy="112" r="5" fill="#5eb1ff"/>
      <text x="90" y="108" font-weight="600">Claude Code</text>
      <text x="90" y="128" font-size="12" fill="#8791a8">token: claude</text>
    </g>
    <g>
      <rect x="40" y="162" width="230" height="64" rx="14" fill="#0e1524" stroke="#7ee0a1" stroke-opacity=".55"/>
      <circle cx="68" cy="194" r="9" fill="#7ee0a1" filter="url(#glow)"/><circle cx="68" cy="194" r="5" fill="#7ee0a1"/>
      <text x="90" y="190" font-weight="600">Codex</text>
      <text x="90" y="210" font-size="12" fill="#8791a8">token: codex</text>
    </g>
    <g>
      <rect x="40" y="244" width="230" height="64" rx="14" fill="#0e1524" stroke="#c79bff" stroke-opacity=".55"/>
      <circle cx="68" cy="276" r="9" fill="#c79bff" filter="url(#glow)"/><circle cx="68" cy="276" r="5" fill="#c79bff"/>
      <text x="90" y="272" font-weight="600">OpenCode</text>
      <text x="90" y="292" font-size="12" fill="#8791a8">token: opencode</text>
    </g>
    <g>
      <rect x="40" y="326" width="230" height="64" rx="14" fill="#0e1524" stroke="#ffb454" stroke-opacity=".55" stroke-dasharray="5 5"/>
      <circle cx="68" cy="358" r="5" fill="#ffb454"/>
      <text x="90" y="354" font-weight="600">Any MCP client</text>
      <text x="90" y="374" font-size="12" fill="#8791a8">one token each</text>
    </g>
  </g>

  <!-- Agent arrows -->
  <g stroke="#8791a8" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M270 112 C320 112 330 190 378 198"/>
    <path d="M270 194 C310 194 340 206 378 208"/>
    <path d="M270 276 C310 276 340 222 378 218"/>
    <path d="M270 358 C320 358 330 236 378 228"/>
  </g>
  <text x="324" y="418" fill="#8791a8" font-size="12" text-anchor="middle">MCP over HTTPS</text>
  <text x="324" y="434" fill="#8791a8" font-size="12" text-anchor="middle">Bearer token</text>

  <!-- Server -->
  <rect x="380" y="40" width="500" height="480" rx="18" fill="#0a101c" stroke="#94aadc" stroke-opacity=".28"/>
  <text x="404" y="74" fill="#e7ecf7" font-size="18" font-weight="700">project-lore</text>
  <text x="856" y="74" fill="#8791a8" font-size="12" text-anchor="end">one Rust binary · one container</text>

  <rect x="404" y="96" width="452" height="62" rx="12" fill="#101a2d" stroke="#94aadc" stroke-opacity=".2"/>
  <text x="424" y="122" fill="#e7ecf7" font-size="15" font-weight="600">Auth and rate limiting</text>
  <text x="424" y="143" fill="#8791a8" font-size="12.5">constant-time token check · failures throttled per address</text>

  <rect x="404" y="176" width="452" height="84" rx="12" fill="#101a2d" stroke="#94aadc" stroke-opacity=".2"/>
  <text x="424" y="202" fill="#e7ecf7" font-size="15" font-weight="600">MCP tools</text>
  <g font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
    <g fill="#04101f">
      <rect x="424" y="216" width="58" height="26" rx="13" fill="#6fb6ff"/><text x="453" y="233" text-anchor="middle">recall</text>
      <rect x="490" y="216" width="42" height="26" rx="13" fill="#7ee0a1"/><text x="511" y="233" text-anchor="middle">log</text>
    </g>
    <g fill="#c5cee0">
      <rect x="540" y="216" width="62" height="26" rx="13" fill="#1a2740"/><text x="571" y="233" text-anchor="middle">recent</text>
      <rect x="610" y="216" width="74" height="26" rx="13" fill="#1a2740"/><text x="647" y="233" text-anchor="middle">projects</text>
      <rect x="692" y="216" width="40" height="26" rx="13" fill="#1a2740"/><text x="712" y="233" text-anchor="middle">get</text>
      <rect x="738" y="216" width="56" height="26" rx="13" fill="#1a2740"/><text x="766" y="233" text-anchor="middle">amend</text>
      <rect x="800" y="216" width="50" height="26" rx="13" fill="#1a2740"/><text x="825" y="233" text-anchor="middle">forget</text>
    </g>
  </g>

  <rect x="404" y="278" width="452" height="110" rx="12" fill="#101a2d" stroke="#94aadc" stroke-opacity=".2"/>
  <text x="424" y="304" fill="#e7ecf7" font-size="15" font-weight="600">Hybrid search</text>
  <rect x="424" y="318" width="196" height="52" rx="10" fill="#0a101c" stroke="#6fb6ff" stroke-opacity=".5"/>
  <text x="522" y="340" fill="#e7ecf7" font-size="13" text-anchor="middle" font-weight="600">Keywords · FTS5</text>
  <text x="522" y="358" fill="#8791a8" font-size="11.5" text-anchor="middle">prefix match, BM25 rank</text>
  <rect x="640" y="318" width="196" height="52" rx="10" fill="#0a101c" stroke="#c79bff" stroke-opacity=".5"/>
  <text x="738" y="340" fill="#e7ecf7" font-size="13" text-anchor="middle" font-weight="600">Meaning · BGE-M3</text>
  <text x="738" y="358" fill="#8791a8" font-size="11.5" text-anchor="middle">local embeddings, any language</text>
  <text x="630" y="349" fill="#8791a8" font-size="13" text-anchor="middle">+</text>

  <rect x="404" y="406" width="452" height="90" rx="12" fill="#101a2d" stroke="#94aadc" stroke-opacity=".2"/>
  <text x="424" y="432" fill="#e7ecf7" font-size="15" font-weight="600">SQLite · one file on a volume</text>
  <text x="424" y="454" fill="#8791a8" font-size="12.5">entries · full-text index · vectors · agent activity</text>
  <text x="424" y="476" fill="#8791a8" font-size="12.5">WAL mode, in-process: no network hop per query</text>

  <g stroke="#8791a8" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M630 158 V174"/>
    <path d="M630 260 V276"/>
    <path d="M630 388 V404"/>
  </g>

  <!-- Admin -->
  <text x="932" y="58" fill="#8791a8" font-size="12" font-weight="600" letter-spacing="1.4">YOU</text>
  <rect x="924" y="80" width="236" height="230" rx="14" fill="#0e1524" stroke="#94aadc" stroke-opacity=".28"/>
  <text x="944" y="110" fill="#e7ecf7" font-size="16" font-weight="600">Admin view</text>
  <text x="944" y="131" fill="#8791a8" font-size="12.5">read-only, in the browser</text>
  <g stroke-width="1.1" fill="none">
    <path d="M990 232 L1040 190 L1096 222 L1062 268 Z" stroke="#6fb6ff" stroke-opacity=".5"/>
    <path d="M1040 190 L1062 268" stroke="#c79bff" stroke-opacity=".5"/>
    <path d="M1096 222 L1128 176" stroke="#7ee0a1" stroke-opacity=".5"/>
    <path d="M990 232 L958 196" stroke="#ffb454" stroke-opacity=".5"/>
  </g>
  <g>
    <circle cx="990" cy="232" r="10" fill="#6fb6ff" filter="url(#glow)"/><circle cx="990" cy="232" r="5" fill="#6fb6ff"/>
    <circle cx="1040" cy="190" r="10" fill="#c79bff" filter="url(#glow)"/><circle cx="1040" cy="190" r="5" fill="#c79bff"/>
    <circle cx="1096" cy="222" r="10" fill="#7ee0a1" filter="url(#glow)"/><circle cx="1096" cy="222" r="5" fill="#7ee0a1"/>
    <circle cx="1062" cy="268" r="10" fill="#ff7a90" filter="url(#glow)"/><circle cx="1062" cy="268" r="5" fill="#ff7a90"/>
    <circle cx="1128" cy="176" r="4" fill="#7ee0a1"/>
    <circle cx="958" cy="196" r="4" fill="#ffb454"/>
  </g>

  <rect x="924" y="330" width="236" height="64" rx="14" fill="#0e1524" stroke="#94aadc" stroke-opacity=".28"/>
  <text x="944" y="357" fill="#e7ecf7" font-size="14" font-weight="600">Password + reCAPTCHA v3</text>
  <text x="944" y="377" fill="#8791a8" font-size="12">5 wrong tries lock the address out</text>

  <path d="M924 450 H884" stroke="#8791a8" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1042 394 V450 H924" stroke="#8791a8" stroke-width="1.4" fill="none"/>
  <text x="1052" y="472" fill="#8791a8" font-size="12" text-anchor="middle">session cookie, read only</text>
</svg>
