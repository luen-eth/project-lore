<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Terminal · project-lore</title>
<link rel="icon" href="/admin/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/vendor/xterm-6.0.0/xterm.css">
<link rel="stylesheet" href="/admin/terminal.css">
</head>
<body>
<header class="bar">
  <img id="avatar" class="avatar" alt="" hidden>
  <div class="title">
    <strong id="name">Terminal</strong>
    <span id="what" class="muted"></span>
  </div>
  <span id="state" class="state connecting" role="status" aria-live="polite">Connecting…</span>
  <div class="buttons">
    <button id="action" class="ghost" type="button" hidden>Reconnect</button>
    <button id="end" class="ghost" type="button" hidden title="Ends the program and everything started in it">End session</button>
  </div>
</header>
<div id="confirm" class="confirm" role="alertdialog" aria-label="End the session?" hidden>
  <span>End this session? The program and everything started in it stop.</span>
  <button id="confirm-end" class="ghost danger" type="button">End session</button>
  <button id="confirm-keep" class="ghost" type="button">Keep it running</button>
</div>
<p id="notice" class="notice" role="status" hidden></p>
<main id="screen" class="screen" aria-label="Terminal"></main>
<script src="/admin/vendor/xterm-6.0.0/xterm.js"></script>
<script src="/admin/vendor/addon-fit-0.11.0/addon-fit.js"></script>
<script src="/admin/terminal.js"></script>
</body>
</html>
