# project-lore as a compose stack: lore alone.
#
#   docker compose up -d --build                 lore, as before
#
# The built-in coding agents live in docker-compose.agents.yml, a complete
# file of its own that takes lore from this one (`extends`) and adds the
# egress proxy, the three agents, their networks and lore's attachments to
# them. Nothing of the agents (no network, no fixed subnet, no runner
# listener) exists unless that file is used:
#
#   docker compose -f docker-compose.agents.yml up -d --build
#   (or COMPOSE_FILE=docker-compose.agents.yml in .env; on Dokploy, the
#   compose path docker-compose.agents.yml)
#
# No port is published: on Dokploy the domain reaches lore through Traefik
# (`expose` below). On a plain docker host, publish it on 127.0.0.1 only
# with the override file, behind your own reverse proxy:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# (or COMPOSE_FILE=docker-compose.yml:docker-compose.local.yml in .env, and
# docker-compose.agents.yml:docker-compose.local.yml with the agents).
#
# The data volume is EXTERNAL: compose never creates it and never deletes it
# (not even with `down -v`). If the volume named below does not exist, compose
# stops with an error instead of starting lore on an empty one. Create it once
# for a new install (`docker volume create project-lore-data`), or set
# LORE_DATA_VOLUME to the name of the volume an existing install already uses
# (see "Moving a single-container install to compose" in the README).

services:
  lore:
    build: .
    image: project-lore:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Built-in agents only with docker-compose.agents.yml, which sets
      # these: lore alone never opens a runner listener, whatever .env says.
      LORE_RUNNER_TOKENS: ""
      # The Codex agent's optional API key is for that agent only.
      LORE_AGENT_CODEX_API_KEY: ""
    expose:
      - "8080"
    volumes:
      - lore-data:/data

volumes:
  lore-data:
    external: true
    name: ${LORE_DATA_VOLUME:-project-lore-data}
